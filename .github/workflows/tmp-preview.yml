# TEMPORARY (removed before the PR): contact sheets of candidate illustrations
name: tmp preview sheets
on:
  push:
    paths: [tmp-preview/cats.json]
permissions:
  contents: write
jobs:
  sheets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node tmp-preview/sheets.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-preview/sheets
          git commit -m "tmp: preview sheets"
          git push origin "HEAD:${GITHUB_REF_NAME}"
