# App Android:
#  - Mỗi lần đổi giao diện/tính năng trên main: build APK (cài thử) + AAB (cho CH Play).
#  - Bấm "Run workflow" và chọn kênh phát hành để đưa lên Google Play.
# Bài giảng mới KHÔNG cần build lại: app tự tải dữ liệu từ trang web.
name: App Android (APK + CH Play)

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'privacy.html'
      - 'css/**'
      - 'js/**'
      - 'icons/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      play_track:
        description: 'Đưa lên Google Play (kênh)'
        type: choice
        default: 'khong'
        options:
          - khong        # chỉ build, không đưa lên
          - internal     # thử nghiệm nội bộ
          - alpha        # thử nghiệm kín (closed testing – cần cho tài khoản cá nhân: 12 người thử × 14 ngày)
          - production   # phát hành chính thức

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The ubuntu runner image already ships the Android SDK (ANDROID_HOME) with licenses accepted;
      # Gradle downloads any missing platform itself.
      - name: Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && test -d "$ANDROID_HOME"

      - name: Cài thư viện & chép giao diện vào app
        run: |
          npm ci
          npm run build
          npx cap sync android
          echo "VERSION_NAME=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Khoá ký (upload key)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Chưa có secret ANDROID_KEYSTORE_BASE64 – chỉ tạo bản debug để cài thử, KHÔNG đưa lên CH Play được. Xem store/HUONG-DAN.md."
          fi

      - name: Build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          PROPS="-PversionCode=$VERSION_CODE -PversionName=$VERSION_NAME"
          if [ -n "$ANDROID_KEYSTORE_FILE" ]; then
            ./gradlew --no-daemon $PROPS assembleRelease bundleRelease
            cp app/build/outputs/apk/release/app-release.apk ../immanuel-hanoi.apk
            cp app/build/outputs/bundle/release/app-release.aab ../immanuel-hanoi.aab
          else
            ./gradlew --no-daemon $PROPS assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../immanuel-hanoi.apk
          fi
          ls -la ../immanuel-hanoi.*

      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}
          path: immanuel-hanoi.*

      - name: Link tải APK cố định (Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app-android --yes --cleanup-tag || true
          gh release create app-android immanuel-hanoi.apk \
            --title "App Android – Immanuel Hà Nội" \
            --notes "Phiên bản $VERSION_NAME ($VERSION_CODE), build lúc $(TZ=Asia/Ho_Chi_Minh date +'%H:%M %d/%m/%Y'). Tải immanuel-hanoi.apk về điện thoại Android để cài thử." \
            --target "${{ github.sha }}"

      - name: Đưa lên Google Play
        if: ${{ inputs.play_track && inputs.play_track != 'khong' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.immanuelhanoi.baigiang
          releaseFiles: immanuel-hanoi.aab
          track: ${{ inputs.play_track }}
          status: completed
